name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install packages
        run: Rscript -e 'install.packages(c("ggplot2", "testthat"), repos = "https://cloud.r-project.org")'

      - name: Run unit tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Run full analysis on example data
        run: Rscript scripts/run_analysis.R
